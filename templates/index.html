<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RNG Space Shooter</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:Arial,Helvetica,sans-serif; color:#fff;
    background:
      radial-gradient(circle at 20% 10%, rgba(168,85,247,.18), transparent 30%),
      radial-gradient(circle at 80% 80%, rgba(239,68,68,.15), transparent 30%),
      linear-gradient(135deg,#050816,#10162b 55%,#090b17);
    padding:24px;
    overflow-x:hidden;
  }
  
  @keyframes shake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    10% { transform: translate(-1px, -2px) rotate(-1deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    30% { transform: translate(3px, 2px) rotate(0deg); }
    40% { transform: translate(1px, -1px) rotate(1deg); }
    50% { transform: translate(-1px, 2px) rotate(-1deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    70% { transform: translate(3px, 1px) rotate(-1deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    90% { transform: translate(1px, 2px) rotate(0deg); }
    100% { transform: translate(1px, -2px) rotate(-1deg); }
  }
  .shake-effect { animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both; }

  .app{width:min(900px,100%)}
  h1{text-align:center;font-size:clamp(30px,5vw,52px);margin:0}
  .sub{text-align:center;color:#94a3b8;margin:8px 0 16px}
  
  .top-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(15,23,42,.8); border:1px solid rgba(255,255,255,.1);
    padding:12px 20px; border-radius:18px; margin-bottom:16px;
    backdrop-filter:blur(10px);
  }
  .badge{font-size:18px; font-weight:bold; color:#facc15}

  .card{
    background:rgba(15,23,42,.78);
    border:1px solid rgba(255,255,255,.1);
    border-radius:26px;padding:26px;
    box-shadow:0 30px 90px rgba(0,0,0,.4);
    backdrop-filter:blur(12px);
  }
  .rng{
    position:relative; height:220px; border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    background:linear-gradient(180deg,rgba(2,6,23,.8),rgba(15,23,42,.95));
    border:1px solid rgba(255,255,255,.08);
  }
  .name{
    position:relative;z-index:2;
    font-size:clamp(40px,7vw,75px);
    font-weight:1000;letter-spacing:1px;text-align:center;
    transition:transform .12s,opacity .12s;
    text-shadow:0 0 26px rgba(255,255,255,.14);
    padding:20px;
  }
  .rolling .name{animation:pulse .11s infinite alternate}
  @keyframes pulse{from{transform:scale(.98)}to{transform:scale(1.02)}}

  .rarity{
    position:relative; text-align:center; min-height:54px;
    margin-top:16px; font-size:24px; font-weight:900;
  }
  .rarity small{display:block;color:#64748b;font-size:12px;letter-spacing:2px;margin-bottom:4px}

  .common{color:#ffffff; text-shadow:0 0 12px rgba(255,255,255,.4)}
  .rare{color:#60a5fa; text-shadow:0 0 20px rgba(96,165,250,.6)}
  .epic{color:#a855f7; text-shadow:0 0 22px rgba(168,85,247,.65)}
  .legendary{color:#f97316; text-shadow:0 0 24px rgba(249,115,22,.7)}
  .mythic{color:#ef4444; text-shadow:0 0 28px rgba(239,68,68,.8)}
  
  @keyframes rgbGradient {
    0% { color: #ff0000; text-shadow: 0 0 20px #ff0000; }
    20% { color: #ff8800; text-shadow: 0 0 20px #ff8800; }
    40% { color: #ffff00; text-shadow: 0 0 20px #ffff00; }
    60% { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
    80% { color: #00ffff; text-shadow: 0 0 20px #00ffff; }
    100% { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
  }
  .secret{ animation: rgbGradient 1.5s linear infinite; font-weight: 1000; }

  .btn-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
  button{
    padding:17px;border:0;border-radius:15px;
    color:#fff;font-size:18px;font-weight:1000;cursor:pointer;
    transition:transform .1s, opacity .2s;
  }
  button:active{transform:scale(0.98)}
  #roll{ background:linear-gradient(135deg,#7c3aed,#2563eb); }
  #play{ background:linear-gradient(135deg,#ef4444,#b91c1c); }
  button:disabled{opacity:.4;cursor:not-allowed}
  
  .stats{ display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px }
  .stat{
    background:rgba(2,6,23,.65);border:1px solid rgba(255,255,255,.07);
    padding:10px 4px;border-radius:14px;text-align:center;font-size:13px;
  }
  .stat b{display:block;font-size:18px;margin-top:3px}
  
  .history{margin-top:18px}
  .history h3{margin:0 0 10px}
  .history-list{display:grid;gap:8px;max-height:160px;overflow:auto}
  .history-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border-radius:11px;background:rgba(2,6,23,.5);
    border:1px solid rgba(255,255,255,.05)
  }
  .tag{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}
  .tag.common{background:rgba(255,255,255,.15); color:#fff}
  .tag.rare{background:rgba(96,165,250,.15); color:#60a5fa}
  .tag.epic{background:rgba(168,85,247,.15); color:#a855f7}
  .tag.legendary{background:rgba(249,115,22,.15); color:#f97316}
  .tag.mythic{background:rgba(239,68,68,.15); color:#ef4444}
  .tag.secret{ animation: rgbGradient 1.5s linear infinite; background: rgba(255,255,255,.1); }

  #effectCanvas { position: fixed; inset: 0; pointer-events: none; z-index: 99; }

  .game-modal{
    display:none;position:fixed;inset:0;
    background:rgba(2,6,23,.92);backdrop-filter:blur(10px);
    z-index:100;place-items:center;padding:20px;
  }
  .game-modal.active{display:grid}
  .game-container{
    background:#0f172a;border:2px solid rgba(255,255,255,.1);
    border-radius:24px;padding:20px;text-align:center;
    max-width:440px;width:100%;
  }
  .game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  canvas{ background:#020617;border-radius:12px;border:1px solid rgba(255,255,255,.08);display:block;margin:0 auto; touch-action:none; }
  .close-btn{background:#e11d48;margin-top:14px;width:100%;padding:12px;font-size:16px}

  @media(max-width:700px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .btn-group{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<canvas id="effectCanvas"></canvas>

<div class="app">
  <h1>🎲 RNG DE APELIDOS</h1>
  <p class="sub">Role novos apelidos e jogue no espaço!</p>

  <div class="top-bar">
    <div class="badge">🪙 <span id="userCoins">100</span> Pontos</div>
  </div>

  <div class="card">
    <div class="rng" id="rngBox">
      <div class="name" id="name">???</div>
    </div>
    <div class="rarity" id="rarity">
      <small>RESULTADO</small>Pronto para rolar
    </div>

    <div class="btn-group">
      <button id="roll">🎲 ROLL (100 Pts)</button>
      <button id="play" disabled>🚀 JOGAR SHOOTER</button>
    </div>

    <div class="stats">
      <div class="stat" style="color:#ffffff">Comum<b>50%</b></div>
      <div class="stat" style="color:#60a5fa">Raro<b>25%</b></div>
      <div class="stat" style="color:#a855f7">Épico<b>15%</b></div>
      <div class="stat" style="color:#f97316">Lendário<b>8.5%</b></div>
      <div class="stat" style="color:#ef4444">Mítico<b>1%</b></div>
    </div>

    <div class="history">
      <h3>📜 Histórico</h3>
      <div class="history-list" id="history"></div>
    </div>
  </div>
</div>

<div class="game-modal" id="gameModal">
  <div class="game-container">
    <div class="game-header">
      <div id="pInfo" style="font-weight:bold">Jogador</div>
      <div>🪙 <span id="gameCoins">0</span> | ❤️ <span id="hp">3</span></div>
    </div>
    <canvas id="shooterCanvas" width="360" height="420"></canvas>
    <button class="close-btn" onclick="closeGame()">✖ Sair do Jogo</button>
  </div>
</div>

<script>
const data = [
  {name:"Henrico", rarity:"Comum"},
  {name:"Nicolas", rarity:"Comum"},
  {name:"Pedro", rarity:"Comum"},

  {name:"Bruno", rarity:"Raro"},
  {name:"Presidente", rarity:"Raro"},
  {name:"Wlissys", rarity:"Raro"},
  {name:"Bagre", rarity:"Raro"},

  {name:"Jadrian", rarity:"Épico"},
  {name:"Guilherme", rarity:"Épico"},
  {name:"Thales", rarity:"Épico"},

  {name:"Lipão", rarity:"Lendário"},
  {name:"Leonardo", rarity:"Lendário"},
  {name:"Oswaldo", rarity:"Lendário"},
  {name:"João", rarity:"Lendário"},

  {name:"RL", rarity:"Mítico"},
  {name:"Matheuzinho", rarity:"Mítico"},
  {name:"Fefa", rarity:"Mítico"},

  {name:"POLO", rarity:"Secreto"}
];

const rarityStats = {
  "Comum":    { color: "#ffffff", shootDelay: 350, bullets: 1, hp: 3 },
  "Raro":     { color: "#60a5fa", shootDelay: 260, bullets: 2, hp: 4 },
  "Épico":    { color: "#a855f7", shootDelay: 190, bullets: 3, hp: 5 },
  "Lendário": { color: "#f97316", shootDelay: 130, bullets: 4, hp: 7 },
  "Mítico":   { color: "#ef4444", shootDelay: 70,  bullets: 5, hp: 10 },
  "Secreto":  { color: "#00ffcc", shootDelay: 35,  bullets: 5, hp: 15 }
};

let coins = 100;
const ROLL_COST = 100;

const nameEl = document.getElementById("name");
const rarityEl = document.getElementById("rarity");
const rollBtn = document.getElementById("roll");
const playBtn = document.getElementById("play");
const rngBox = document.getElementById("rngBox");
const historyEl = document.getElementById("history");
const userCoinsEl = document.getElementById("userCoins");

let rolling = false;
let history = [];
let currentResult = null;

// Efectos Visuais
const fxCanvas = document.getElementById("effectCanvas");
const fxCtx = fxCanvas.getContext("2d");
let fxParticles = [];

function resizeFx(){ fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
window.addEventListener("resize", resizeFx);
resizeFx();

function triggerFx(type){
  if(type === "Secreto"){
    document.body.classList.add("shake-effect");
    setTimeout(() => document.body.classList.remove("shake-effect"), 600);
  }
  for(let i=0; i<(type==="Secreto"?120:60); i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 10;
    fxParticles.push({
      x: window.innerWidth/2, y: window.innerHeight/2,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      size: 4 + Math.random()*5, life: 1, decay: 0.02,
      color: type === "Secreto" ? `hsl(${Math.random()*360}, 100%, 60%)` : '#ef4444'
    });
  }
}

function renderFx(){
  fxCtx.clearRect(0,0,fxCanvas.width, fxCanvas.height);
  for(let i = fxParticles.length - 1; i >= 0; i--){
    let p = fxParticles[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    fxCtx.fillStyle = p.color; fxCtx.globalAlpha = Math.max(0, p.life);
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); fxCtx.fill();
    if(p.life <= 0) fxParticles.splice(i, 1);
  }
  requestAnimationFrame(renderFx);
}
renderFx();

function updateUI(){
  userCoinsEl.textContent = coins;
  if(!rolling) rollBtn.disabled = coins < ROLL_COST;
}

function className(r){
  if(r==="Comum") return "common";
  if(r==="Raro") return "rare";
  if(r==="Épico") return "epic";
  if(r==="Lendário") return "legendary";
  if(r==="Mítico") return "mythic";
  if(r==="Secreto") return "secret";
  return "common";
}

function rarityRoll(){
  const n = Math.random() * 100;
  if(n < 0.5) return "Secreto";
  if(n < 1.5) return "Mítico";
  if(n < 10.0) return "Lendário";
  if(n < 25.0) return "Épico";
  if(n < 50.0) return "Raro";
  return "Comum";
}

function pick(rarity){
  const p = data.filter(x=>x.rarity===rarity);
  return p[Math.floor(Math.random() * p.length)];
}

function randomAny(){ 
  const visibleData = data.filter(x => x.rarity !== "Secreto");
  return visibleData[Math.floor(Math.random() * visibleData.length)]; 
}

function addHistory(item){
  history.unshift(item);
  if(history.length > 8) history.pop();
  historyEl.innerHTML = history.map(x=>`
    <div class="history-item">
      <strong>${x.name}</strong>
      <span class="tag ${className(x.rarity)}">${x.rarity}</span>
    </div>
  `).join("");
}

async function roll(){
  if(rolling || coins < ROLL_COST) return;
  coins -= ROLL_COST;
  updateUI();

  rolling = true; rollBtn.disabled = true; playBtn.disabled = true;
  rngBox.classList.add("rolling");
  rarityEl.innerHTML = '<small>SORTEANDO...</small>???';
  rarityEl.className = 'rarity';

  const rarity = rarityRoll();
  const result = pick(rarity);
  currentResult = result;

  const duration = 2500;
  const start = performance.now();
  let lastChange = 0;

  function frame(now){
    const elapsed = now - start;
    const t = Math.min(1, elapsed / duration);
    if(now - lastChange >= 35 + Math.pow(t, 3) * 180){
      nameEl.textContent = randomAny().name;
      nameEl.className = "name";
      lastChange = now;
    }

    if(t < 1){
      requestAnimationFrame(frame);
    }else{
      nameEl.textContent = result.name;
      nameEl.className = `name ${className(result.rarity)}`;
      rarityEl.innerHTML = `<small>VOCÊ CONSEGUIU</small>${result.rarity}`;
      rarityEl.className = `rarity ${className(result.rarity)}`;
      rngBox.classList.remove("rolling");
      rolling = false;
      playBtn.disabled = false;
      
      if(result.rarity === "Mítico" || result.rarity === "Secreto"){
        triggerFx(result.rarity);
      }
      updateUI();
      addHistory(result);
    }
  }
  requestAnimationFrame(frame);
}

rollBtn.addEventListener("click", roll);

// Minijogo Shooter
const modal = document.getElementById("gameModal");
const canvas = document.getElementById("shooterCanvas");
const ctx = canvas.getContext("2d");
const pInfo = document.getElementById("pInfo");
const gameCoinsEl = document.getElementById("gameCoins");
const hpEl = document.getElementById("hp");

let player = {x: 180, y: 360, size: 20};
let bullets = [], rocks = [], particles = [];
let sessionCoins = 0, currentHp = 3, gameLoopId = null, lastShootTime = 0, currentStats = null;

playBtn.addEventListener("click", startGame);

function startGame(){
  if(!currentResult) return;
  modal.classList.add("active");
  currentStats = rarityStats[currentResult.rarity];
  pInfo.textContent = currentResult.name;
  pInfo.style.color = currentResult.rarity === "Secreto" ? "#00ffcc" : currentStats.color;
  
  sessionCoins = 0; currentHp = currentStats.hp;
  gameCoinsEl.textContent = sessionCoins; hpEl.textContent = currentHp;
  player.x = canvas.width / 2; player.y = canvas.height - 40;
  bullets = []; rocks = []; particles = [];
  
  canvas.addEventListener('mousemove', handleMove);
  canvas.addEventListener('touchmove', handleTouch);
  if(gameLoopId) cancelAnimationFrame(gameLoopId);
  requestAnimationFrame(loop);
}

function closeGame(){
  modal.classList.remove("active");
  cancelAnimationFrame(gameLoopId);
  canvas.removeEventListener('mousemove', handleMove);
  canvas.removeEventListener('touchmove', handleTouch);
  updateUI();
}

function handleMove(e){ player.x = e.clientX - canvas.getBoundingClientRect().left; }
function handleTouch(e){ if(e.touches[0]) player.x = e.touches[0].clientX - canvas.getBoundingClientRect().left; }

function spawnRock(){
  if(Math.random() < 0.035){
    rocks.push({ x: Math.random()*(canvas.width-40)+20, y: -30, speed: 1.5+Math.random()*1.5, size: 15+Math.random()*10, hp: 2 });
  }
}

function shoot(now){
  if(now - lastShootTime >= currentStats.shootDelay){
    lastShootTime = now;
    for(let i=0; i<currentStats.bullets; i++){
      bullets.push({x: player.x + (i - (currentStats.bullets-1)/2)*8, y: player.y - 15, vy: -7});
    }
  }
}

function loop(now){
  ctx.fillStyle = "#020617"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  shoot(now); spawnRock();

  ctx.fillStyle = currentResult.rarity === "Secreto" ? `hsl(${(now/5)%360}, 100%, 60%)` : currentStats.color;
  for(let i = bullets.length - 1; i >= 0; i--){
    let b = bullets[i]; b.y += b.vy;
    ctx.fillRect(b.x - 2, b.y - 6, 4, 10);
    if(b.y < -10) bullets.splice(i, 1);
  }

  for(let i = rocks.length - 1; i >= 0; i--){
    let r = rocks[i]; r.y += r.speed;
    ctx.fillStyle = "#64748b";
    ctx.beginPath(); ctx.arc(r.x, r.y, r.size, 0, Math.PI * 2); ctx.fill();

    for(let j = bullets.length - 1; j >= 0; j--){
      let b = bullets[j];
      if(Math.hypot(b.x - r.x, b.y - r.y) < r.size){
        r.hp--; bullets.splice(j, 1);
        if(r.hp <= 0){
          coins += 15; sessionCoins += 15;
          gameCoinsEl.textContent = sessionCoins;
          rocks.splice(i, 1);
        }
        break;
      }
    }

    if(r && Math.hypot(player.x - r.x, player.y - r.y) < r.size + player.size){
      rocks.splice(i, 1); currentHp--; hpEl.textContent = currentHp;
      if(currentHp <= 0){ alert(`Game Over! Ganhou +${sessionCoins} Pontos!`); closeGame(); return; }
    }
    if(r && r.y > canvas.height + 30) rocks.splice(i, 1);
  }

  ctx.fillStyle = currentResult.rarity === "Secreto" ? `hsl(${(now/5)%360}, 100%, 60%)` : currentStats.color;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - player.size);
  ctx.lineTo(player.x - player.size, player.y + player.size);
  ctx.lineTo(player.x + player.size, player.y + player.size);
  ctx.fill();

  gameLoopId = requestAnimationFrame(loop);
}

updateUI();
</script>
</body>
</html>
